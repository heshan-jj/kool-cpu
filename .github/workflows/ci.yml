name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: kool-cpu-windows-x86_64
            ext: .exe
          - os: ubuntu-latest
            artifact: kool-cpu-linux-x86_64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Build Windows installer (kool-cpu-setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\packaging\windows\build-installer.ps1

      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist_pkg
          cp target/release/kool-cpu${{ matrix.ext }} dist_pkg/
          cp target/release/kool-cpu-gui${{ matrix.ext }} dist_pkg/
          cp LICENSE README.md dist_pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist_pkg/

      - name: Upload Windows setup.exe artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: kool-cpu-windows-installer
          path: dist/kool-cpu-setup.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip release bundles and generate SHA-256 checksums
        run: |
          cd artifacts
          if [ -f kool-cpu-windows-installer/kool-cpu-setup.exe ]; then
            mv kool-cpu-windows-installer/kool-cpu-setup.exe ./
            rmdir kool-cpu-windows-installer
          fi
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -r "../${name}.zip" .)
          done
          sha256sum *.zip *.exe > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/checksums.txt
