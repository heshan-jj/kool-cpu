[package]
name = "kool-cpu-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kool-cpu-gui"
path = "src/main.rs"

[dependencies]
kool-cpu-core = { path = "../kool-cpu-core" }
kool-cpu-backend = { path = "../kool-cpu-backend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
