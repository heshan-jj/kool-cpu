[package]
name = "kool-cpu-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kool-cpu-gui"
path = "src/main.rs"

[dependencies]
kool-cpu-core = { path = "../kool-cpu-core" }
kool-cpu-backend = { path = "../kool-cpu-backend" }
# Use glow (OpenGL) instead of default wgpu (DX12/Vulkan) and skip system_fonts scan to keep RAM low.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.27"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
